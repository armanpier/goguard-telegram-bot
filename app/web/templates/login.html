<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت GoGuard Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Vazirmatn', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-blue-600/20 text-blue-500 border border-blue-500/30 flex items-center justify-center text-3xl mx-auto mb-4">
                🚀
            </div>
            <h1 class="text-2xl font-bold text-white">ورود به پنل مدیریت</h1>
            <p class="text-sm text-slate-400 mt-1">مدیریت ربات و فروشگاه GoGuard</p>
        </div>

        {% if error %}
        <div class="mb-5 p-3 rounded-lg bg-red-950/50 border border-red-800 text-red-200 text-sm flex items-center gap-2">
            <span>⚠️</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">نام کاربری ادمین</label>
                <input type="text" name="username" required autofocus placeholder="admin"
                    class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1.5">رمز عبور</label>
                <input type="password" name="password" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-sm">
            </div>

            <button type="submit"
                class="w-full mt-2 py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl shadow-lg shadow-blue-600/20 transition text-sm">
                ورود به پنل
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-6">
            GoGuard Telegram Bot 1.0 &bull; طراحی شده برای فروش VPN و پروکسی
        </p>
    </div>
</body>
</html>
