services:
  goguard-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goguard_telegram_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/bot.db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
