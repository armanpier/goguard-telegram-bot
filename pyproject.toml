[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goguard-telegram-bot"
version = "1.0.0"
description = "Production-ready Telegram Bot for selling VPN subscriptions integrated with GoGuard Panel API 1.0 (mirzabot workflow)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GoGuard Bot Developer" }
]
dependencies = [
    "aiogram>=3.13.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "qrcode>=7.4.2",
    "pillow>=10.4.0",
    "jdatetime>=5.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
